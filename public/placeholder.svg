<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <!-- Midnight background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D18" />
      <stop offset="50%" stop-color="#101522" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>

    <!-- Subtle violet ambient glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#9165FF" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#9165FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#9165FF" stop-opacity="0" />
    </radialGradient>

    <!-- Streamly brand tile gradient -->
    <linearGradient id="brandTile" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B46F6" />
      <stop offset="50%" stop-color="#9165FF" />
      <stop offset="100%" stop-color="#B69AFF" />
    </linearGradient>

    <!-- Play icon drop shadow filter -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#9165FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1200" fill="url(#bgGrad)" />
  <rect width="800" height="1200" fill="url(#glow)" />

  <!-- Subtle grid lines for cinematic texture -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="400" y1="0" x2="400" y2="1200" />
  </g>

  <!-- Centered Logo Group -->
  <g transform="translate(400, 520)">
    <!-- Streamly Geometric Brand Tile -->
    <rect x="-70" y="-70" width="140" height="140" rx="34" fill="url(#brandTile)" filter="url(#tileShadow)" />
    <!-- Inner stroke -->
    <rect x="-69" y="-69" width="138" height="138" rx="33" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    
    <!-- White Play Triangle Glyph -->
    <path d="M-15 -32 L36 0 L-15 32 Z" fill="#FFFFFF" />

    <!-- Streamly Wordmark -->
    <g transform="translate(0, 130)">
      <text text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#F7F7FC" letter-spacing="-1">
        Stream<tspan fill="#B69AFF">ly</tspan>
      </text>
      <!-- Accent Violet Dot -->
      <circle cx="106" cy="-8" r="5" fill="#9165FF" />
    </g>

    <!-- Subtitle text -->
    <text y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#929BB0" letter-spacing="1">
      CINEMATIC STREAMING
    </text>
  </g>

  <!-- Subtle card border -->
  <rect x="1" y="1" width="798" height="1198" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
</svg>